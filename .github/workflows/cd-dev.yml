name: CD - Development

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_TRAINING: ${{ github.repository }}/training-backend
  IMAGE_NAME_DATASETS: ${{ github.repository }}/datasets-backend

jobs:
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment:
      name: development
      url: http://dev.vcc-clara.local
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log deployment start
        run: |
          echo "## 🚀 Development Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TRAINING }}:develop || true
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_DATASETS }}:develop || true

      - name: Create deployment directory
        run: |
          mkdir -p deployment/dev
          
      - name: Generate docker-compose for dev
        run: |
          cat > deployment/dev/docker-compose.yml <<'EOF'
          version: '3.8'

          services:
            postgres:
              image: postgres:13
              environment:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
                POSTGRES_DB: clara_dev
              volumes:
                - postgres_data:/var/lib/postgresql/data
              ports:
                - "5432:5432"
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres"]
                interval: 10s
                timeout: 5s
                retries: 5

            training-backend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TRAINING }}:develop
              environment:
                - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/clara_dev
                - CLARA_SECURITY_MODE=development
                - SERVICE_PORT=45680
              ports:
                - "45680:45680"
              depends_on:
                postgres:
                  condition: service_healthy
              restart: unless-stopped

            datasets-backend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_DATASETS }}:develop
              environment:
                - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/clara_dev
                - CLARA_SECURITY_MODE=development
                - SERVICE_PORT=45681
              ports:
                - "45681:45681"
              depends_on:
                postgres:
                  condition: service_healthy
              restart: unless-stopped

          volumes:
            postgres_data:
          EOF

      - name: Create deployment script
        run: |
          cat > deployment/dev/deploy.sh <<'EOF'
          #!/bin/bash
          set -e

          echo "🚀 Starting VCC-Clara Development Deployment..."

          # Pull latest images
          echo "📥 Pulling latest images..."
          docker-compose pull

          # Stop existing containers
          echo "🛑 Stopping existing services..."
          docker-compose down

          # Start services
          echo "▶️  Starting services..."
          docker-compose up -d

          # Wait for services to be healthy
          echo "⏳ Waiting for services to be ready..."
          sleep 10

          # Health checks
          echo "🏥 Running health checks..."
          
          # Check Training Backend
          if curl -f http://localhost:45680/health > /dev/null 2>&1; then
            echo "✅ Training Backend is healthy"
          else
            echo "❌ Training Backend health check failed"
            exit 1
          fi

          # Check Datasets Backend
          if curl -f http://localhost:45681/health > /dev/null 2>&1; then
            echo "✅ Datasets Backend is healthy"
          else
            echo "❌ Datasets Backend health check failed"
            exit 1
          fi

          echo "✅ Development deployment complete!"
          docker-compose ps
          EOF
          
          chmod +x deployment/dev/deploy.sh

      - name: Simulate deployment (dry-run)
        run: |
          echo "📋 Deployment configuration validated"
          echo "✅ Docker Compose file created"
          echo "✅ Deployment script created"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "- Training Backend: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TRAINING }}:develop\`" >> $GITHUB_STEP_SUMMARY
          echo "- Datasets Backend: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME_DATASETS }}:develop\`" >> $GITHUB_STEP_SUMMARY
          echo "- Database: PostgreSQL 13" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- Training Backend: http://localhost:45680" >> $GITHUB_STEP_SUMMARY
          echo "- Datasets Backend: http://localhost:45681" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Actual deployment requires on-premise infrastructure." >> $GITHUB_STEP_SUMMARY

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-deployment-${{ github.sha }}
          path: deployment/dev/
          retention-days: 30

      - name: Deployment summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Prepared" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment artifacts uploaded. To deploy on-premise:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Download artifacts and run:" >> $GITHUB_STEP_SUMMARY
          echo "cd deployment/dev" >> $GITHUB_STEP_SUMMARY
          echo "./deploy.sh" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
