name: Build Offline Deployment Package

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'latest'

jobs:
  build-offline-package:
    name: Build Offline Deployment Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Create deployment package directory
        run: |
          mkdir -p offline-deployment/{images,scripts,configs,docs}
          
      - name: Build Docker images and save to tar
        run: |
          cat > Dockerfile.training <<'EOF'
          FROM python:3.13-slim as builder
          WORKDIR /build
          RUN apt-get update && apt-get install -y --no-install-recommends gcc g++ && rm -rf /var/lib/apt/lists/*
          COPY requirements.txt .
          RUN pip install --user --no-cache-dir -r requirements.txt
          FROM python:3.13-slim
          RUN useradd -m -u 1000 clara && mkdir -p /app && chown -R clara:clara /app
          WORKDIR /app
          USER clara
          COPY --from=builder /root/.local /home/clara/.local
          ENV PATH=/home/clara/.local/bin:$PATH
          COPY --chown=clara:clara backend ./backend
          COPY --chown=clara:clara shared ./shared
          COPY --chown=clara:clara config ./config
          EXPOSE 45680
          CMD ["python", "-m", "backend.training.app"]
          EOF
          
          docker build -f Dockerfile.training -t vcc-clara-training:${{ steps.version.outputs.version }} .
          docker save vcc-clara-training:${{ steps.version.outputs.version }} | gzip > offline-deployment/images/training-backend.tar.gz
          
          cat > Dockerfile.datasets <<'EOF'
          FROM python:3.13-slim as builder
          WORKDIR /build
          RUN apt-get update && apt-get install -y --no-install-recommends gcc g++ && rm -rf /var/lib/apt/lists/*
          COPY requirements.txt .
          RUN pip install --user --no-cache-dir -r requirements.txt
          FROM python:3.13-slim
          RUN useradd -m -u 1000 clara && mkdir -p /app && chown -R clara:clara /app
          WORKDIR /app
          USER clara
          COPY --from=builder /root/.local /home/clara/.local
          ENV PATH=/home/clara/.local/bin:$PATH
          COPY --chown=clara:clara backend ./backend
          COPY --chown=clara:clara shared ./shared
          COPY --chown=clara:clara config ./config
          EXPOSE 45681
          CMD ["python", "-m", "backend.datasets.app"]
          EOF
          
          docker build -f Dockerfile.datasets -t vcc-clara-datasets:${{ steps.version.outputs.version }} .
          docker save vcc-clara-datasets:${{ steps.version.outputs.version }} | gzip > offline-deployment/images/datasets-backend.tar.gz
          
          echo "✅ Images built and saved"
          ls -lh offline-deployment/images/

      - name: Create configurations and scripts
        run: |
          cat > offline-deployment/scripts/deploy.sh <<'DEPLOY_EOF'
          #!/bin/bash
          set -e
          ENV=${1:-dev}
          echo "🚀 Deploying VCC-Clara ($ENV)..."
          if ! docker images | grep -q vcc-clara; then
            echo "Loading images..."
            gunzip -c ../images/training-backend.tar.gz | docker load
            gunzip -c ../images/datasets-backend.tar.gz | docker load
          fi
          cd ../configs
          docker-compose -f docker-compose-${ENV}.yml up -d
          echo "✅ Deployed"
          DEPLOY_EOF
          
          chmod +x offline-deployment/scripts/deploy.sh
          
          cat > offline-deployment/README.md <<'README_EOF'
          # VCC-Clara Offline Deployment
          
          **Manual Deployment | On-Premise | Offline Build**
          
          ## Deployment
          
          1. Extract: `tar xzf vcc-clara-offline-*.tar.gz`
          2. Deploy: `cd offline-deployment/scripts && ./deploy.sh dev`
          
          ## Requirements
          - Docker 24.0+
          - Docker Compose 2.0+
          - 8GB RAM minimum
          README_EOF

      - name: Package
        run: |
          tar czf vcc-clara-offline-${{ steps.version.outputs.version }}.tar.gz offline-deployment/
          ls -lh vcc-clara-offline-${{ steps.version.outputs.version }}.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vcc-clara-offline-${{ steps.version.outputs.version }}
          path: vcc-clara-offline-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 90

      - name: Summary
        run: |
          echo "## 📦 Offline Package Built" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** Manual Deployment" >> $GITHUB_STEP_SUMMARY
