name: Build Docker Images

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_TRAINING: ${{ github.repository }}/training-backend
  IMAGE_NAME_DATASETS: ${{ github.repository }}/datasets-backend

jobs:
  build-training:
    name: Build Training Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TRAINING }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Create Dockerfile for Training Backend
        run: |
          cat > Dockerfile.training <<'EOF'
          # Multi-stage build for Training Backend
          FROM python:3.13-slim as builder

          WORKDIR /build

          # Install build dependencies
          RUN apt-get update && apt-get install -y --no-install-recommends \
              gcc \
              g++ \
              && rm -rf /var/lib/apt/lists/*

          # Copy requirements and install dependencies
          COPY requirements.txt .
          RUN pip install --user --no-cache-dir -r requirements.txt

          # Runtime stage
          FROM python:3.13-slim

          # Create non-root user
          RUN useradd -m -u 1000 clara && \
              mkdir -p /app && \
              chown -R clara:clara /app

          WORKDIR /app
          USER clara

          # Copy dependencies from builder
          COPY --from=builder /root/.local /home/clara/.local
          ENV PATH=/home/clara/.local/bin:$PATH

          # Copy application code
          COPY --chown=clara:clara backend/training ./backend/training
          COPY --chown=clara:clara shared ./shared
          COPY --chown=clara:clara config ./config

          # Health check
          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
            CMD python -c "import requests; requests.get('http://localhost:45680/health')" || exit 1

          EXPOSE 45680

          CMD ["python", "-m", "backend.training.app"]
          EOF

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.training
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-datasets:
    name: Build Datasets Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_DATASETS }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Create Dockerfile for Datasets Backend
        run: |
          cat > Dockerfile.datasets <<'EOF'
          # Multi-stage build for Datasets Backend
          FROM python:3.13-slim as builder

          WORKDIR /build

          # Install build dependencies
          RUN apt-get update && apt-get install -y --no-install-recommends \
              gcc \
              g++ \
              && rm -rf /var/lib/apt/lists/*

          # Copy requirements and install dependencies
          COPY requirements.txt .
          RUN pip install --user --no-cache-dir -r requirements.txt

          # Runtime stage
          FROM python:3.13-slim

          # Create non-root user
          RUN useradd -m -u 1000 clara && \
              mkdir -p /app && \
              chown -R clara:clara /app

          WORKDIR /app
          USER clara

          # Copy dependencies from builder
          COPY --from=builder /root/.local /home/clara/.local
          ENV PATH=/home/clara/.local/bin:$PATH

          # Copy application code
          COPY --chown=clara:clara backend/datasets ./backend/datasets
          COPY --chown=clara:clara shared ./shared
          COPY --chown=clara:clara config ./config

          # Health check
          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
            CMD python -c "import requests; requests.get('http://localhost:45681/health')" || exit 1

          EXPOSE 45681

          CMD ["python", "-m", "backend.datasets.app"]
          EOF

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.datasets
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-training, build-datasets]
    if: always()
    steps:
      - name: Build Status
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Training Backend: ${{ needs.build-training.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Datasets Backend: ${{ needs.build-datasets.result }}" >> $GITHUB_STEP_SUMMARY
