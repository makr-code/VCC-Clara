name: CD - Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g., v1.0.0)'
        required: true
      confirm:
        description: 'Type "deploy-production" to confirm'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_TRAINING: ${{ github.repository }}/training-backend
  IMAGE_NAME_DATASETS: ${{ github.repository }}/datasets-backend

jobs:
  validate:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-production" ]; then
            echo "❌ Confirmation failed. Please type 'deploy-production' exactly."
            exit 1
          fi
          echo "✅ Confirmation validated"

      - name: Validate version tag
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Use semantic versioning (e.g., v1.0.0)"
            exit 1
          fi
          echo "✅ Version tag validated: ${{ github.event.inputs.version }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
      url: https://vcc-clara.local
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Log deployment start
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Generate production docker-compose
        run: |
          mkdir -p deployment/production
          cat > deployment/production/docker-compose.yml <<'EOF'
          version: '3.8'

          services:
            postgres:
              image: postgres:13
              environment:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                POSTGRES_DB: clara_production
              volumes:
                - postgres_data:/var/lib/postgresql/data
                - ./postgres-backup:/backup
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres"]
                interval: 10s
                timeout: 5s
                retries: 5
              restart: always
              deploy:
                resources:
                  limits:
                    cpus: '2'
                    memory: 4G
                  reservations:
                    cpus: '1'
                    memory: 2G

            training-backend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TRAINING }}:${{ github.event.inputs.version }}
              environment:
                - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/clara_production
                - CLARA_SECURITY_MODE=production
                - CLARA_JWT_ENABLED=true
                - CLARA_MTLS_ENABLED=true
                - SERVICE_PORT=45680
              ports:
                - "45680:45680"
              depends_on:
                postgres:
                  condition: service_healthy
              restart: always
              deploy:
                resources:
                  limits:
                    cpus: '4'
                    memory: 8G
                  reservations:
                    cpus: '2'
                    memory: 4G
              healthcheck:
                test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:45680/health')"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s

            datasets-backend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_DATASETS }}:${{ github.event.inputs.version }}
              environment:
                - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/clara_production
                - CLARA_SECURITY_MODE=production
                - CLARA_JWT_ENABLED=true
                - CLARA_MTLS_ENABLED=true
                - SERVICE_PORT=45681
              ports:
                - "45681:45681"
              depends_on:
                postgres:
                  condition: service_healthy
              restart: always
              deploy:
                resources:
                  limits:
                    cpus: '4'
                    memory: 8G
                  reservations:
                    cpus: '2'
                    memory: 4G
              healthcheck:
                test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:45681/health')"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s

          volumes:
            postgres_data:
          EOF

      - name: Create production deployment script
        run: |
          cat > deployment/production/deploy.sh <<'EOF'
          #!/bin/bash
          set -e

          echo "🚀 VCC-Clara Production Deployment"
          echo "Version: ${{ github.event.inputs.version }}"
          echo ""

          # Backup check
          if [ ! -f ".backup-verified" ]; then
            echo "⚠️  WARNING: No backup verification found!"
            read -p "Have you verified recent database backup? (yes/no): " backup_confirm
            if [ "$backup_confirm" != "yes" ]; then
              echo "❌ Deployment aborted. Please verify backup first."
              exit 1
            fi
          fi

          # Pull images
          echo "📥 Pulling production images..."
          docker-compose pull

          # Backup current database
          echo "💾 Creating pre-deployment backup..."
          docker-compose exec -T postgres pg_dump -U postgres clara_production > backup/pre-deployment-$(date +%Y%m%d-%H%M%S).sql

          # Stop services (zero-downtime deployment would use blue-green)
          echo "🛑 Stopping current services..."
          docker-compose down

          # Start new version
          echo "▶️  Starting new version..."
          docker-compose up -d

          # Wait for health checks
          echo "⏳ Waiting for services to be healthy..."
          sleep 30

          # Verify deployment
          echo "🏥 Running health checks..."
          
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f http://localhost:45680/health && curl -f http://localhost:45681/health; then
              echo "✅ All services are healthy"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Retry $RETRY_COUNT/$MAX_RETRIES..."
            sleep 10
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Health checks failed! Rolling back..."
            docker-compose down
            # Restore from backup and restart old version
            exit 1
          fi

          echo "✅ Production deployment successful!"
          docker-compose ps
          EOF
          
          chmod +x deployment/production/deploy.sh

      - name: Create rollback script
        run: |
          cat > deployment/production/rollback.sh <<'EOF'
          #!/bin/bash
          set -e

          echo "🔄 VCC-Clara Production Rollback"
          
          read -p "Enter version to rollback to: " ROLLBACK_VERSION
          
          echo "🛑 Stopping current services..."
          docker-compose down
          
          echo "📥 Pulling rollback version images..."
          export VERSION=$ROLLBACK_VERSION
          docker-compose pull
          
          echo "▶️  Starting rollback version..."
          docker-compose up -d
          
          echo "⏳ Waiting for services..."
          sleep 30
          
          echo "🏥 Verifying rollback..."
          if curl -f http://localhost:45680/health && curl -f http://localhost:45681/health; then
            echo "✅ Rollback successful to version $ROLLBACK_VERSION"
          else
            echo "❌ Rollback verification failed!"
            exit 1
          fi
          EOF
          
          chmod +x deployment/production/rollback.sh

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-${{ github.event.inputs.version }}
          path: deployment/production/
          retention-days: 365

      - name: Deployment summary
        run: |
          echo "### ✅ Production Deployment Package Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Security:** Full (JWT + mTLS)" >> $GITHUB_STEP_SUMMARY
          echo "**Resources:** 4 CPU / 8GB RAM per service" >> $GITHUB_STEP_SUMMARY
          echo "**Health Checks:** Enabled with auto-restart" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Instructions" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# 1. Download deployment artifacts" >> $GITHUB_STEP_SUMMARY
          echo "# 2. Extract to production server" >> $GITHUB_STEP_SUMMARY
          echo "cd deployment/production" >> $GITHUB_STEP_SUMMARY
          echo "# 3. Set POSTGRES_PASSWORD environment variable" >> $GITHUB_STEP_SUMMARY
          echo "# 4. Run deployment" >> $GITHUB_STEP_SUMMARY
          echo "./deploy.sh" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback" >> $GITHUB_STEP_SUMMARY
          echo "If needed, use \`./rollback.sh\` to revert to a previous version." >> $GITHUB_STEP_SUMMARY

      - name: Create deployment record
        run: |
          mkdir -p deployment/production/records
          cat > deployment/production/records/${{ github.event.inputs.version }}.json <<EOF
          {
            "version": "${{ github.event.inputs.version }}",
            "deployed_at": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "deployed_by": "${{ github.actor }}",
            "commit": "${{ github.sha }}",
            "images": {
              "training": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TRAINING }}:${{ github.event.inputs.version }}",
              "datasets": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_DATASETS }}:${{ github.event.inputs.version }}"
            }
          }
          EOF
